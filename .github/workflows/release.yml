name: Release

# Push a tag like v0.2.0 (stable) or v0.3.0-preview.1 (preview, GitHub pre-release) — see scripts/bump-version.ps1.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Helm for Android: the same version as the Windows app, signed with the release keystore from the repository
  # secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD; see docs/android.md). The key must never change,
  # otherwise phones cannot install the update over the version they have.
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Android workload and SDK packages
        run: |
          dotnet workload install android
          dotnet build src/Helm.App.Android -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing (docs/android.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/helm-release.keystore"

      - name: Build signed APK
        env:
          HELM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # SHA-256 of the Helm release certificate (public). A different key would break updates on every phone.
          RELEASE_CERT_SHA256: e97a927caec382d0cd42c52806dda29202008227acbe5b32c85c791375bef223
        run: |
          version="${TAG#v}"
          dotnet build src/Helm.App.Android --configuration Release -p:Version="$version" \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:HelmKeystore="$RUNNER_TEMP/helm-release.keystore"
          rm -f "$RUNNER_TEMP/helm-release.keystore"
          cp src/Helm.App.Android/bin/Release/net10.0-android/com.huyhung1404.helm-Signed.apk Helm-android.apk
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner"
          echo "Verifying with $apksigner"
          if ! certs=$("$apksigner" verify --print-certs Helm-android.apk 2>&1); then
            echo "$certs"
            echo "::error::apksigner could not verify Helm-android.apk"
            exit 1
          fi
          echo "$certs"
          if ! echo "$certs" | grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256"; then
            echo "::error::Helm-android.apk is not signed with the Helm release key ($RELEASE_CERT_SHA256)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: helm-android
          path: Helm-android.apk
          if-no-files-found: error

  release:
    needs: android
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO_URL: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version and channel from the tag
        id: meta
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix" }
          $version = $tag.Substring(1)
          $pre = $version.Contains('-')
          $channel = if ($pre) { 'preview' } else { 'stable' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Helm $version on channel $channel (pre-release: $pre)"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore

      - name: Restore tools (vpk)
        run: dotnet tool restore

      - name: Download previous release (for delta packages)
        shell: pwsh
        continue-on-error: true
        run: |
          $vpkArgs = @('vpk', 'download', 'github', '--repoUrl', $env:REPO_URL, '--token', $env:GH_TOKEN,
                    '--channel', '${{ steps.meta.outputs.channel }}', '--outputDir', 'releases')
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $vpkArgs += '--pre' }
          dotnet @vpkArgs

      - name: Publish and pack (framework-dependent; add -SelfContained to bundle the runtime)
        shell: pwsh
        run: ./scripts/release-local.ps1 -Version '${{ steps.meta.outputs.version }}' -Channel '${{ steps.meta.outputs.channel }}' -OutputDir releases

      - name: Upload release to GitHub
        shell: pwsh
        run: |
          $vpkArgs = @('vpk', 'upload', 'github',
                    '--repoUrl', $env:REPO_URL, '--token', $env:GH_TOKEN,
                    '--outputDir', 'releases', '--channel', '${{ steps.meta.outputs.channel }}',
                    '--tag', $env:TAG, '--releaseName', 'Helm ${{ steps.meta.outputs.version }}',
                    '--publish', '--merge')
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $vpkArgs += '--pre' }
          dotnet @vpkArgs
          if ($LASTEXITCODE -ne 0) { throw 'vpk upload failed' }

      - uses: actions/download-artifact@v4
        with:
          name: helm-android
          path: releases

      - name: Friendly installer name, Android APK, release notes from CHANGELOG
        shell: pwsh
        run: |
          $channel = '${{ steps.meta.outputs.channel }}'
          Copy-Item "releases/HelmApp-$channel-Setup.exe" 'releases/Helm-win-Setup.exe'
          gh release upload $env:TAG 'releases/Helm-win-Setup.exe' 'releases/Helm-android.apk' --clobber
          $notes = 'artifacts/notes-${{ steps.meta.outputs.version }}.md'
          $flags = @('--notes-file', $notes)
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' } else { $flags += '--latest' }
          gh release edit $env:TAG @flags
