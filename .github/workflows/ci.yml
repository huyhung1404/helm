name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # .NET 8 is the target runtime; the latest SDK builds it (same as local development).
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/sync-worker/package-lock.json

      - name: Sync worker (typecheck, unit tests)
        working-directory: server/sync-worker
        run: |
          npm ci
          npm run typecheck
          npm test

      # SyncServerTests run the real engine against a local Worker (wrangler dev). The Worker must be started in
      # the same step as the tests: Windows runners end a step's background processes when the step finishes.
      - name: Test (with a local sync worker for the end-to-end tests)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          $worker = Join-Path $PWD 'server/sync-worker'
          $admin = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Output "::add-mask::$admin"
          "ADMIN_TOKEN=$admin" | Set-Content (Join-Path $worker '.dev.vars') -Encoding ascii
          $wrangler = Start-Process -FilePath npx.cmd -ArgumentList 'wrangler', 'dev', '--port', '8787', '--ip', '127.0.0.1' `
            -WorkingDirectory $worker -RedirectStandardOutput (Join-Path $worker 'wrangler.log') `
            -RedirectStandardError (Join-Path $worker 'wrangler.err') -NoNewWindow -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8787/health | Out-Null; $ready = $true } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { Get-Content (Join-Path $worker 'wrangler.log'), (Join-Path $worker 'wrangler.err'); exit 1 }

          $env:HELM_SYNC_TEST_URL = 'http://127.0.0.1:8787'
          $env:HELM_SYNC_TEST_ADMIN = $admin
          dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Output '--- wrangler log ---'; Get-Content (Join-Path $worker 'wrangler.log') -Tail 80 }
          Stop-Process -Id $wrangler.Id -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
