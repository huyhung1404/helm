# Helm sync server. Setup and deploy: see README.md in this folder.
name = "helm-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Served only on the custom domain; the *.workers.dev URL stays off.
workers_dev = false
routes = [{ pattern = "sync.huyhung1404.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "AccountObject"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountObject", "RegistryObject"]

# Nightly backups (02:00 in Vietnam). Create the bucket first: R2 -> Create bucket -> helm-sync-backups.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "helm-sync-backups"

# Encrypted blob chunks (Vault documents). Create the bucket first: R2 -> Create bucket -> helm-sync-blobs.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "helm-sync-blobs"

# Limits that can be raised without a code change (also editable under Settings -> Variables and Secrets).
# MAX_BLOB_MB: largest document; MAX_QUOTA_MB: highest storage quota the admin may give an account.
# TOMBSTONE_DAYS: how long a deletion stays on the server before the nightly clean-up removes it.
#
# Presigned blob URLs (chunks go straight between devices and R2, not through the Worker) need an R2 API token with
# Object Read & Write on helm-sync-blobs: set R2_ACCOUNT_ID (your Cloudflare account id), R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY as secrets (a deploy replaces plain variables with this file's, but keeps secrets). Without them
# blobs keep streaming through the Worker.
[vars]
MAX_BLOB_MB = "256"
MAX_QUOTA_MB = "102400"
TOMBSTONE_DAYS = "90"

[triggers]
crons = ["0 19 * * *"]

# Per-IP limits: invite redemption, and failed admin sign-ins (period must be 10 or 60 seconds).
[[ratelimits]]
name = "REDEEM_LIMITER"
namespace_id = "1101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1102"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
